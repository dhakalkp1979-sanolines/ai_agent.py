name: Daily Sanolines AI Agent

on:
  schedule:
    - cron: '0 8 * * *' 
  workflow_dispatch: 

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install google-genai feedparser

      - name: Run AI Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ai_agent.py

      - name: Save Posts Artifact
        uses: actions/upload-artifact@v3
        with:
          name: daily-posts
          path: today_posts.txt
